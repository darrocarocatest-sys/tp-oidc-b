name: probe
on:
  pull_request_target:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: is an OIDC id_token issuable in a fork-PR context
        run: |
          set -uo pipefail
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF event=$GITHUB_EVENT_NAME actor=$GITHUB_ACTOR"
          echo "workflow_ref=$GITHUB_WORKFLOW_REF"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "RESULT=NO-ID-TOKEN-ENV (id-token write not granted in this context)"
            exit 0
          fi
          echo "RESULT=ID-TOKEN-ENV-PRESENT"
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
          echo "::add-mask::$IDT"
          [ -z "$IDT" ] && { echo "RESULT=MINT-REFUSED"; exit 0; }
          python3 - "$IDT" <<'PY'
          import sys,json,base64
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("---CLAIMS-BEGIN---"); print(json.dumps(c,indent=1,sort_keys=True)); print("---CLAIMS-END---")
          PY
          ESC='%40larocas-bbresearch%2Ftp-probe-e29834ce'
          CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $IDT" \
                 "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESC")
          echo "---EXCHANGE-STATUS--- $CODE"
          python3 -c 'import json,hashlib;d=json.load(open("/tmp/r.json"));t=d.get("token");print("BODY", {**d,"token":"eyJh<redacted:%d>"%len(t)} if t else d)'
          echo "---DONE---"
